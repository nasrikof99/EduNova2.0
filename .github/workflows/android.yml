name: Bina APK EduNova
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['README.md']
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dapatkan kod
        uses: actions/checkout@v4
      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sediakan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sediakan Android SDK
        uses: android-actions/setup-android@v3
      - name: Pasang pakej
        run: npm install --no-audit --no-fund
      - name: Bina web dan Android
        run: |
          npm run build
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms = ('    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                   '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                   '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n')
          s=s.replace('    <application',perms+'    <application',1)
          p.write_text(s)
          PY
          npx cap sync android
      - name: Kompil APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Muat naik APK
        uses: actions/upload-artifact@v4
        with:
          name: EduNova-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
